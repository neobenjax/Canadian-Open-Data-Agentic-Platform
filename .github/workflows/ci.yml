name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format Check (Ruff)
        run: uv run ruff format --check .

      - name: Type Check (Pyright)
        run: uv run pyright

      - name: Run Test Suite (Pytest)
        run: uv run pytest -m 'not live'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/docs-portal/package-lock.json

      - name: Verify Docs Portal Production Build (Vercel Simulation)
        working-directory: apps/docs-portal
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Verify Streamlit Headless Configuration
        run: uv run streamlit --version

      - name: DeepEval Automated Scoring & Verification (CAN-42)
        run: uv run python collaboration/benchmarks/run_agent_evals.py grade collaboration/benchmarks/agent_evals/runs/agent_demo_live_20261104.jsonl --require-tier1

      - name: Verify Bundled Task Checkbox (Guardrail 25)
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.head_ref }}  # branch names are untrusted; never inline them
        run: uv run python scripts/verify_pr_ready.py --branch "$PR_BRANCH"
