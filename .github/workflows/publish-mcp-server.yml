name: Publish Standalone MCP Server Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'distribution/**'
      - 'packages/**'
      - 'tests/**'
      - 'ABOUT_THE_TEAM.md'
      - '.cursorrules'
      - '.env.example'
      - '.gitignore'
      - 'LICENSE'
      - '.github/workflows/publish-mcp-server.yml'
  workflow_dispatch:

concurrency:
  group: publish-mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-mcp-server:
    runs-on: ubuntu-latest
    name: Publish to Canadian-Open-Data-Agentic-Platform-MCP-Server

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Clone Distribution Repository
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$WIKI_SYNC_TOKEN" ]; then
            echo "::warning ::Secret WIKI_SYNC_TOKEN is not configured. Skipping MCP Server push."
            exit 0
          fi

          echo "Cloning target MCP Server repository..."
          git clone "https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/neobenjax/Canadian-Open-Data-Agentic-Platform-MCP-Server.git" dist_repo

      - name: Synchronize MCP Package & Clean Bloat
        run: |
          if [ ! -d "dist_repo" ]; then
            exit 0
          fi

          echo "Washing out non-MCP bloat from distribution repository..."
          for bloat in "apps" "presentation" "collaboration" "assets" "CANADIAN_AGENTIC_DATA_PLATFORM_PLAN.md" "General Plan - idea.md" "TASKS.md" "linear_tasks_import.csv"; do
            rm -rf "dist_repo/$bloat"
          done

          echo "Overlaying distribution assets..."
          if [ -d "distribution" ]; then
            cp -r distribution/* dist_repo/
          fi

          echo "Overlaying shared configuration and core packages..."
          for item in "ABOUT_THE_TEAM.md" ".cursorrules" ".env.example" ".gitignore" "LICENSE"; do
            if [ -f "$item" ]; then
              cp "$item" "dist_repo/"
            fi
          done

          for dir in "packages" "tests"; do
            if [ -d "$dir" ]; then
              rm -rf "dist_repo/$dir"
              cp -r "$dir" "dist_repo/"
            fi
          done

      - name: Commit and Push with Original Author Attribution
        # Pass event data through env, never as inline expressions in the script:
        # commit messages with quotes, backticks or $(...) would otherwise be
        # executed as shell (GitHub Actions script injection).
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ ! -d "dist_repo" ]; then
            exit 0
          fi

          cd dist_repo

          if [ -z "$AUTHOR_NAME" ] || [ "$AUTHOR_NAME" = "null" ]; then
            AUTHOR_NAME="Benjamin Sanchez Zebadua"
            AUTHOR_EMAIL="besaze@hotmail.com"
          fi

          if [ -z "$COMMIT_MSG" ] || [ "$COMMIT_MSG" = "null" ]; then
            COMMIT_MSG="feat: update MCP Server package distribution [skip ci]"
          fi

          echo "Attributing commit to: $AUTHOR_NAME <$AUTHOR_EMAIL>"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes detected. Distribution repository is already up to date."
          else
            git commit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" -m "$COMMIT_MSG"
            git push origin main
            echo "Successfully published latest MCP Server distribution with original author attribution."
          fi
