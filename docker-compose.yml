# ==============================================================================
# Canadian Open Data Agentic Platform — Docker Compose Multi-Service Suite
# Enforces Docker security hardening: non-root users, cap_drop, and read-only rootfs
# ==============================================================================

services:
  # LangGraph Multi-Agent Orchestration & Streamlit Interactive UI
  candata-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    image: ghcr.io/neobenjax/canadian-open-data-agentic-platform/candata-orchestrator:latest
    container_name: candata-agent-orchestrator
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "8501:8501"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - candata-checkpoints:/app/.candata
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-candata-platform}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - candata-net

volumes:
  candata-checkpoints:
    name: candata-checkpoints-data

networks:
  candata-net:
    name: candata-internal-network
    driver: bridge
