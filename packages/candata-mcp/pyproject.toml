[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candata-mcp"
version = "0.1.0"
description = "Official Canadian Open Data FastMCP 2.0 Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
]

[project.scripts]
candata-mcp = "candata_mcp.server:main"
