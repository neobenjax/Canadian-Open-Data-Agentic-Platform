[project]
name = "canadian-open-data-agentic-platform"
version = "0.0.0"
description = "Monorepo tooling for CanData-MCP. Not published; packaging candata-mcp is CAN-51."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/candata-mcp/src"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: hits real public APIs; run with `pytest -m live`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/candata-mcp/src", "."]
# Files with findings that predate this config (165 on 2026-10-19). Remove each entry once
# its owner has cleaned the file, so `ruff check .` covers the whole repo again.
extend-exclude = [
    "scripts/sync_tasks.py",
    "scripts/generate_social_showcase.py",
    "scripts/verify_branch_protection.py",
    "scripts/sync_mcp_server.py",
    "collaboration/social/render_linear_mockup.py",
    "tests/test_verify_branch_protection.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages/candata-mcp/src", "tests/connectors"]
extraPaths = ["packages/candata-mcp/src", "."]
strict = ["packages/candata-mcp/src"]
