[project]
name = "canadian-open-data-agentic-platform"
version = "0.0.0"
description = "Monorepo tooling for CanData-MCP. Not published; packaging candata-mcp is CAN-51."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.0",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "pyarrow>=17.0.0",
]

[project.scripts]
candata-mcp = "candata_mcp.server:main"

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/candata-mcp/src", "packages/agent-orchestrator/src"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: hits real public APIs; run with `pytest -m live`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/candata-mcp/src", "packages/agent-orchestrator/src", "."]
# Files with findings that predate this config (165 on 2026-10-19). Remove each entry once
# its owner has cleaned the file, so `ruff check .` covers the whole repo again.
extend-exclude = [
    "scripts/sync_tasks.py",
    "scripts/generate_social_showcase.py",
    "scripts/verify_branch_protection.py",
    "scripts/sync_mcp_server.py",
    "collaboration/social/render_linear_mockup.py",
    "collaboration/benchmarks/build_ground_truth.py",
    "tests/test_verify_branch_protection.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Benchmark question, trap and markdown-template text is kept on one line per string so it
# stays readable and diffable; every other rule still applies to this file.
"collaboration/benchmarks/build_ground_truth.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages/candata-mcp/src", "packages/agent-orchestrator/src", "tests/connectors"]
extraPaths = ["packages/candata-mcp/src", "packages/agent-orchestrator/src", "."]
strict = ["packages/candata-mcp/src", "packages/agent-orchestrator/src"]
